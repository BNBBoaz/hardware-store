
# ─────────────────────────────────────────────
#  Hardware Store — Docker Compose
#  Starts 4 containers with one command:
#    docker compose up --build
# ─────────────────────────────────────────────

services:

  # ── 1. DATABASE ──────────────────────────────
  postgres:
    image: postgres:16-alpine          # lightweight postgres image
    container_name: hardware_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}        # values come from .env file
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data  # data persists even if container restarts
    ports:
      - "5432:5432"                    # lets you connect with Postman or DBeaver locally
    networks:
      - hardware_net
    healthcheck:                       # backend waits for this before starting
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 2. BACKEND (Node/Express) ─────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hardware_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy     # only starts after postgres is ready
    networks:
      - hardware_net
    volumes:
      - ./backend:/app                 # live code reload — changes reflect instantly
      - /app/node_modules              # keeps container's node_modules separate

  # ── 3. FRONTEND (React/Vite) ──────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hardware_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - hardware_net
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # ── 4. NGINX (reverse proxy) ──────────────────
  nginx:
    image: nginx:alpine
    container_name: hardware_nginx
    restart: unless-stopped
    ports:
      - "80:80"                        # port 80 = http://localhost (no port number needed)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - hardware_net

# ─────────────────────────────────────────────
networks:
  hardware_net:
    driver: bridge                     # containers talk to each other by name, not IP

volumes:
  postgres_data:                       # named volume — survives docker compose down
